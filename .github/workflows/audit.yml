name: Entry audit

on:
  schedule:
    # Weekly, Tuesday 07:00 UTC
    - cron: "0 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every entry
        # bash runs with -eo pipefail, so a crash in audit.py fails the job
        # instead of being hidden by the pipe through tee.
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/audit.py README.md --status-file status.txt | tee report.md
      - name: Open, update, or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create audit --description "Automated entry audit" --color BFD4F2 2>/dev/null || true
          existing=$(gh issue list --label audit --state open --json number --jq '.[0].number // empty')
          status=$(cat status.txt 2>/dev/null || echo missing)
          if [ "$status" = "actionable" ]; then
            if [ -n "$existing" ]; then gh issue edit "$existing" --body-file report.md
            else gh issue create --title "Entry audit: action needed" --label audit --body-file report.md; fi
          elif [ "$status" = "clean" ] && [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Latest audit found nothing to act on."
          fi
